# Headers for requests going to a backend service's REST listener.
#
# The split from proxy-common.conf is deliberate: the frontend needs the raw
# Cookie header (its server-rendered auth reads osbourne_session directly),
# while the services must not receive it at all.

include /etc/nginx/includes/proxy-common.conf;

# The browser holds the JWT in an HttpOnly osbourne_session cookie; the services
# expect `Authorization: Bearer <jwt>`, because that is what
# common.AuthInterceptor reads. So the cookie is promoted into the header here.
#
# Keying the map off Authorization rather than off the cookie is what makes an
# explicit header win: a request carrying both keeps its own header, so curl and
# Postman keep working while debugging a session that has expired in the
# browser. (A cookie-only request, the normal case, falls through to the
# cookie.)
proxy_set_header Authorization $auth_from_session;

# The session cookie is dropped rather than forwarded. common.IncomingHeaderMatcher
# already refuses to copy Cookie into gRPC metadata, so this is defence in depth:
# without it the raw token sits in the service's access log for every request,
# which is exactly what HttpOnly is meant to prevent.
proxy_set_header Cookie "";
