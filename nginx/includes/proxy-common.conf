# Headers every proxied request needs, regardless of whether it is headed for
# the frontend or for a backend service.
#
# Included from both proxy-common locations (pages) and proxy-api locations
# (JSON), so a change here reaches all of them. Anything a backend needs on top
# of this belongs in proxy-api.conf, not here.

# HTTP/1.1 to the upstream is not optional for the two streaming routes: with
# the default 1.0, a chunked request body cannot be forwarded at all, so
# `proxy_request_buffering off` would turn large uploads into a 400.
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Each request gets a fresh id. The services map this onto the x-request-id
# metadata key (common.IncomingHeaderMatcher) and it lands in their structured
# logs, so a browser request, the nginx access line and the gRPC log line all
# share one id.
proxy_set_header X-Request-ID $request_id;
