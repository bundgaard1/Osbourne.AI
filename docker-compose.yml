networks:
  osbourne-net:
    driver: bridge

volumes:
  profile-data:
  notification-data:
  course-catalogue-data:
  course-content-data:
  assignment-data:

services:
  api-gateway:
    image: nginx:alpine
    container_name: osbourne-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      profile-service:
        condition: service_started
      notification-service:
        condition: service_started
      course-catalogue-service:
        condition: service_started
    networks: 
      - osbourne-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: osbourne-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Dashboard (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - osbourne-net
    restart: unless-stopped

  profile-service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    container_name: osbourne-profile-service
    environment:
      - PORT=50051
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/profiles.db
    volumes: 
      - profile-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: osbourne-notification-service
    environment:
      - PORT=50052
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/notification.db  
    volumes: 
      - notification-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  course-catalogue-service:
    build:
      context: ./course-catalogue-service
      dockerfile: Dockerfile
    container_name: osbourne-course-catalogue-service
    environment:
      - PORT=50053
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/course-catalogue.db   
    volumes: 
      - course-catalogue-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  
  course-content-service:
    build:
      context: ./course-content-service
      dockerfile: Dockerfile
    container_name: osbourne-course-content-service
    environment:
      - PORT=50054
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - NOSQL_PATH=/app/data
    volumes: 
      - course-content-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  assignment-service:
    build:
      context: ./assignment-service
      dockerfile: Dockerfile
    container_name: osbourne-assignment-service
    environment:
      - PORT=50055
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/assignment.db
      - UPLOAD_DIR=/app/data/uploads
      - SEED_DATA=true
    volumes:
      - assignment-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: osbourne-frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PROFILE_SERVICE_ADDR=dns:///profile-service:50051
      - NOTIFICATION_SERVICE_ADDR=dns:///notification-service:50052
      - COURSE_CATALOGUE_SERVICE_ADDR=dns:///course-catalogue-service:50053
      - COURSE_CONTENT_SERVICE_ADDR=dns:///course-content-service:50054
      - ASSIGNMENT_SERVICE_ADDR=dns:///assignment-service:50055
    depends_on:
      - profile-service
      - notification-service
      - course-catalogue-service
      - course-content-service
    networks:
      - osbourne-net
    restart: unless-stopped

  