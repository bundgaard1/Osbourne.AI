networks:
  osbourne-net:
    driver: bridge

volumes:
  profile-data:
  notification-data:
  course-catalogue-data:
  course-content-data:
  assignment-data:
  auth-data:

services:
  api-gateway:
    image: nginx:alpine
    container_name: osbourne-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      profile-service:
        condition: service_started
      notification-service:
        condition: service_started
      course-catalogue-service:
        condition: service_started
    networks: 
      - osbourne-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: osbourne-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Dashboard (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - osbourne-net
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: osbourne-auth-service
    environment:
      - PORT=50056
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/auth.db
      - JWT_SECRET=dev-secret-change-me
    volumes:
      - auth-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  profile-service:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    container_name: osbourne-profile-service
    environment:
      - PORT=50051
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/profiles.db
      - JWT_SECRET=dev-secret-change-me
    volumes: 
      - profile-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: osbourne-notification-service
    environment:
      - PORT=50052
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/notification.db
      - JWT_SECRET=dev-secret-change-me
    volumes: 
      - notification-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  course-catalogue-service:
    build:
      context: .
      dockerfile: course-catalogue-service/Dockerfile
    container_name: osbourne-course-catalogue-service
    environment:
      - PORT=50053
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/course-catalogue.db
      - JWT_SECRET=dev-secret-change-me
    volumes: 
      - course-catalogue-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  course-content-service:
    build:
      context: .
      dockerfile: course-content-service/Dockerfile
    container_name: osbourne-course-content-service
    environment:
      - PORT=50054
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - NOSQL_PATH=/app/data
      - JWT_SECRET=dev-secret-change-me
    volumes: 
      - course-content-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  assignment-service:
    build:
      context: .
      dockerfile: assignment-service/Dockerfile
    container_name: osbourne-assignment-service
    environment:
      - PORT=50055
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/assignment.db
      - UPLOAD_DIR=/app/data/uploads
      - SEED_DATA=true
      - JWT_SECRET=dev-secret-change-me
    volumes:
      - assignment-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: osbourne-frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_ADDR=dns:///auth-service:50056
      - PROFILE_SERVICE_ADDR=dns:///profile-service:50051
      - NOTIFICATION_SERVICE_ADDR=dns:///notification-service:50052
      - COURSE_CATALOGUE_SERVICE_ADDR=dns:///course-catalogue-service:50053
      - COURSE_CONTENT_SERVICE_ADDR=dns:///course-content-service:50054
      - ASSIGNMENT_SERVICE_ADDR=dns:///assignment-service:50055
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      - profile-service
      - notification-service
      - course-catalogue-service
      - course-content-service
      - auth-service
    networks:
      - osbourne-net
    restart: unless-stopped