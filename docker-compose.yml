networks:
  osbourne-net:
    driver: bridge

volumes:
  profile-data:
  notification-data:
  course-catalogue-data:
  course-content-data:
  assignment-data:
  auth-data:

services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # proxy-common.conf and proxy-api.conf hold the header rules that
      # nginx.conf includes. Without this the gateway cannot parse its own
      # config and exits, so the two mounts have to stay together.
      - ./nginx/includes:/etc/nginx/includes:ro
    # Not load-bearing. nginx.conf keeps its upstreams in variables, so names
    # are resolved per request and the gateway starts and stays up even while a
    # backend is down. This is here so a cold `docker compose up` has every name
    # registered before the first request, rather than to fix a parse error.
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_started
      profile-service:
        condition: service_started
      notification-service:
        condition: service_started
      course-content-service:
        condition: service_started
      course-catalogue-service:
        condition: service_started
      assignment-service:
        condition: service_started
    networks: 
      - osbourne-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672" # Management Dashboard (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - osbourne-net
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      - PORT=50056
      # REST listener for the nginx api-gateway. Spelled out because
      # nginx.conf hard-codes 8080 for every backend, so a silent change to the
      # default in common.GatewayMux would 502 every route with no other clue.
      - HTTP_PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/auth.db
      - JWT_SECRET=dev-secret-change-me
    volumes:
      - auth-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  profile-service:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    environment:
      - PORT=50051
      # REST listener for the nginx api-gateway. Spelled out because
      # nginx.conf hard-codes 8080 for every backend, so a silent change to the
      # default in common.GatewayMux would 502 every route with no other clue.
      - HTTP_PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/profiles.db
      - JWT_SECRET=dev-secret-change-me
    volumes: 
      - profile-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      - PORT=50052
      # REST listener for the nginx api-gateway. Spelled out because
      # nginx.conf hard-codes 8080 for every backend, so a silent change to the
      # default in common.GatewayMux would 502 every route with no other clue.
      - HTTP_PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/notification.db
      - JWT_SECRET=dev-secret-change-me
    volumes: 
      - notification-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  course-catalogue-service:
    build:
      context: .
      dockerfile: course-catalogue-service/Dockerfile
    environment:
      - PORT=50053
      # REST listener for the nginx api-gateway. Spelled out because
      # nginx.conf hard-codes 8080 for every backend, so a silent change to the
      # default in common.GatewayMux would 502 every route with no other clue.
      - HTTP_PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/course-catalogue.db
      - JWT_SECRET=dev-secret-change-me
    volumes: 
      - course-catalogue-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  course-content-service:
    build:
      context: .
      dockerfile: course-content-service/Dockerfile
    environment:
      - PORT=50054
      # REST listener for the nginx api-gateway. Spelled out because
      # nginx.conf hard-codes 8080 for every backend, so a silent change to the
      # default in common.GatewayMux would 502 every route with no other clue.
      - HTTP_PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - NOSQL_PATH=/app/data
      - JWT_SECRET=dev-secret-change-me
    volumes: 
      - course-content-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  assignment-service:
    build:
      context: .
      dockerfile: assignment-service/Dockerfile
    environment:
      - PORT=50055
      # REST listener for the nginx api-gateway. Spelled out because
      # nginx.conf hard-codes 8080 for every backend, so a silent change to the
      # default in common.GatewayMux would 502 every route with no other clue.
      - HTTP_PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/assignment.db
      - UPLOAD_DIR=/app/data/uploads
      - SEED_DATA=true
      - JWT_SECRET=dev-secret-change-me
    volumes:
      - assignment-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # No host port: the browser goes through the api-gateway on port 80, which
    # is the only place the /api/* routes exist now. Binding 8080 as well would
    # expose a copy of the app that silently lacks them, so the login form would
    # post into a void.
    environment:
      - PORT=8080
      - AUTH_SERVICE_ADDR=dns:///auth-service:50056
      - PROFILE_SERVICE_ADDR=dns:///profile-service:50051
      - NOTIFICATION_SERVICE_ADDR=dns:///notification-service:50052
      - COURSE_CATALOGUE_SERVICE_ADDR=dns:///course-catalogue-service:50053
      - COURSE_CONTENT_SERVICE_ADDR=dns:///course-content-service:50054
      - ASSIGNMENT_SERVICE_ADDR=dns:///assignment-service:50055
      - JWT_SECRET=dev-secret-change-me
    depends_on:
      - profile-service
      - notification-service
      - course-catalogue-service
      - course-content-service
      - auth-service
      - assignment-service
    networks:
      - osbourne-net
    restart: unless-stopped