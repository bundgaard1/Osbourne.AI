events { worker_connections 1024; }

http {

    # Docker's built-in DNS server always has the address 127.0.0.11
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Promotes the browser's HttpOnly session cookie into the Authorization
    # header the services' auth interceptors read. An Authorization header
    # supplied by the client takes precedence, so curl and Postman are not
    # forced to go through a cookie.
    #
    # Note the empty-token case: a request with neither an Authorization header
    # nor a cookie is forwarded with a bare "Bearer ". That is deliberate. The
    # alternative - omitting the header entirely - needs a second map to detect,
    # and the services already answer Unauthenticated for a token they cannot
    # parse, so the empty header produces the same 401 either way.
    map $http_authorization $auth_from_session {
        ""      "Bearer $cookie_osbourne_session";
        default $http_authorization;
    }

    server {
        listen 80;

        # Submissions are capped at 10 MB by the upload route in
        # assignment-service. Nginx's 1 MB default would reject a large upload
        # at the gateway with a bare 413 and no JSON body, so the limit is set
        # above the application's own to leave the application the authority on
        # the exact number.
        client_max_body_size 12m;

        # Upstreams are held in variables rather than written into proxy_pass
        # directly. With a literal hostname, nginx resolves it when it parses the
        # config, which has two bad consequences: `nginx -t` fails unless every
        # backend is already up and reachable, and a container that is recreated
        # gets a new IP that a running nginx has already cached - so the gateway
        # either refuses to start or keeps proxying to a dead address.
        #
        # A variable defers the lookup to request time and routes it through the
        # `resolver` above, so a recreated backend is picked up on the next
        # request instead of requiring a gateway restart. The cost is that nginx
        # can no longer tell whether a URI part was given, so the original request
        # URI has to be appended explicitly - which is what preserves the path and
        # the query string, both of which the services depend on.
        set $upstream_auth        "http://auth-service:8080";
        set $upstream_profile     "http://profile-service:8080";
        set $upstream_notification "http://notification-service:8080";
        set $upstream_content     "http://course-content-service:8080";
        set $upstream_catalogue   "http://course-catalogue-service:8080";
        set $upstream_assignment  "http://assignment-service:8080";
        set $upstream_frontend    "http://frontend:8080";

        # -------------------------------------------------------------------
        # API routes.
        #
        # Regex locations are tried in the order they appear, and the first
        # match wins - unlike prefix locations, which take the longest match.
        # That is why the three /api/courses/... routes below are ordered from
        # most to least specific: /api/courses/42/modules has to reach
        # course-content before the catch-all /api/courses(/|$) sends it to the
        # catalogue.
        #
        # They are regex rather than prefix on purpose: prefix matching cannot
        # express "the second path segment is literally 'modules'", which is the
        # whole disambiguation problem here.
        #
        # The request URI is forwarded unchanged: these services own the whole
        # /api/... tree, so a rewritten path would 404 against their own gateway.
        # -------------------------------------------------------------------

        location ~ ^/api/auth(/|$) {
            proxy_pass $upstream_auth$request_uri;
            include /etc/nginx/includes/proxy-api.conf;
        }

        location ~ ^/api/profile(/|$) {
            proxy_pass $upstream_profile$request_uri;
            include /etc/nginx/includes/proxy-api.conf;
        }

        location ~ ^/api/notifications(/|$) {
            proxy_pass $upstream_notification$request_uri;
            include /etc/nginx/includes/proxy-api.conf;
        }

        # Course content: the two routes that hang off /api/courses/{id}/ and
        # whose next segment names a sub-resource, so the catalogue must not
        # see them.
        location ~ ^/api/courses/[^/]+/modules(/|$) {
            proxy_pass $upstream_content$request_uri;
            include /etc/nginx/includes/proxy-api.conf;
        }

        # Assignment: the same shape under /api/courses/{id}/assignments.
        location ~ ^/api/courses/[^/]+/assignments(/|$) {
            proxy_pass $upstream_assignment$request_uri;
            include /etc/nginx/includes/proxy-api.conf;
        }

        # The two streaming routes, hand-written in
        # assignment-service/internal/httpapi rather than generated from the
        # proto annotations. They are pulled out of the generic assignment
        # locations below so they can carry settings that would be wrong for
        # the JSON routes.
        #
        # Upload: without proxy_request_buffering off, nginx reads the whole
        # body into a temporary file on disk before proxying, which defeats the
        # point of streaming it to the service chunk by chunk and doubles the
        # disk needed per concurrent upload.
        location ~ ^/api/assignments/[^/]+/submissions$ {
            proxy_pass $upstream_assignment$request_uri;
            include /etc/nginx/includes/proxy-api.conf;

            proxy_request_buffering off;

            # A 10 MB upload on a slow link, plus the service writing it to
            # storage, can outlast the 60s default.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Chunked request bodies are the norm here, so do not let nginx try
            # to determine the length up front.
            chunked_transfer_encoding on;
        }

        # Download: the service writes the file to the response in chunks, and
        # the browser should see it arrive. Without proxy_buffering off nginx
        # would hold the whole file in its own buffers first.
        location ~ ^/api/submissions/[^/]+/file$ {
            proxy_pass $upstream_assignment$request_uri;
            include /etc/nginx/includes/proxy-api.conf;

            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Everything else the assignment service owns: the assignment list and
        # detail, and the submission reads and grading. This must stay after the
        # two locations above, which it would otherwise shadow.
        location ~ ^/api/(assignments|submissions)(/|$) {
            proxy_pass $upstream_assignment$request_uri;
            include /etc/nginx/includes/proxy-api.conf;
        }

        # The catalogue owns the bare /api/courses routes and all of
        # /api/enrollments.
        location ~ ^/api/(courses|enrollments)(/|$) {
            proxy_pass $upstream_catalogue$request_uri;
            include /etc/nginx/includes/proxy-api.conf;
        }

        # Catch-all for unrouted /api/ paths. A regex location beats a prefix
        # one, so everything above is matched before this is considered - which
        # is what allows a prefix location to act as a backstop at all.
        #
        # Without it an unrouted /api/ path would fall through to `location /`
        # and be answered with the frontend's HTML, so a client parsing JSON
        # would get a syntax error instead of a 404 it can act on.
        location /api/ {
            default_type application/json;
            return 404 '{"code":404,"success":false,"message":"unknown API route"}';
        }

        # Everything else is the frontend.
        location / {
            proxy_pass $upstream_frontend$request_uri;
            include /etc/nginx/includes/proxy-common.conf;
        }
    }
}
