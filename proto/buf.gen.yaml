version: v1
plugins:
  # For Frontend
  - plugin: go
    out: ../frontend/gen
    opt: paths=source_relative

  - plugin: go-grpc
    out: ../frontend/gen
    opt: paths=source_relative

  # For Users Service
  - plugin: go
    out: ../profile-service/gen
    opt: paths=source_relative

  - plugin: go-grpc
    out: ../profile-service/gen
    opt: paths=source_relative

  # For Notification Service
  - plugin: go
    out: ../notification-service/gen
    opt: paths=source_relative

  - plugin: go-grpc
    out: ../notification-service/gen
    opt: paths=source_relative

  # For Course Catalogue Service
  - plugin: go
    out: ../course-catalogue-service/gen
    opt: paths=source_relative

  - plugin: go-grpc
    out: ../course-catalogue-service/gen
    opt: paths=source_relative

  # For Course Content Service
  - plugin: go
    out: ../course-content-service/gen
    opt: paths=source_relative

  - plugin: go-grpc
    out: ../course-content-service/gen
    opt: paths=source_relative

  # For Assignment Service
  - plugin: go
    out: ../assignment-service/gen
    opt: paths=source_relative

  - plugin: go-grpc
    out: ../assignment-service/gen
    opt: paths=source_relative