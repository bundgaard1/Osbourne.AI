syntax = "proto3";

package notification.catalogue;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "osbourne.local/notification-service/gen/notification;notification";

service NotificationService {
  // `user_id` is optional: over REST it is left empty and the server falls back
  // to the JWT subject.
  rpc GetUserNotifications (NotificationsRequest) returns (NotificationsResponse) {
    option (google.api.http) = {
      get: "/api/notifications"
    };
  }

  // No `body`: the message carries nothing but the path parameter.
  rpc MarkNotificationAsRead (MarkNotificationAsReadRequest) returns (MarkNotificationAsReadResponse) {
    option (google.api.http) = {
      post: "/api/notifications/{notification_id}/read"
    };
  }
}

message NotificationsRequest {
  string user_id = 1;
}

message NotificationsResponse {
  repeated Notification notifications = 1;
}

message MarkNotificationAsReadRequest {
  string notification_id = 1;
}

message MarkNotificationAsReadResponse {
  bool success = 1;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string msg = 4;
  bool isRead = 6;
  google.protobuf.Timestamp timestamp = 7;
}
