syntax = "proto3";

package coursecatalogue;

import "google/api/annotations.proto";

option go_package = "osbourne.local/course-catalogue-service/gen/course-catalogue;coursecatalogue";

service CourseCatalogueService {
  // `page` and `page_size` bind from the query string: /api/courses?page=1&page_size=10
  rpc ListCourses (ListCoursesRequest) returns (ListCoursesResponse) {
    option (google.api.http) = {
      get: "/api/courses"
    };
  }

  rpc GetCourse (GetCourseRequest) returns (GetCourseResponse) {
    option (google.api.http) = {
      get: "/api/courses/{course_id}"
    };
  }

  // Lives under /api/enrollments rather than /api/courses/{course_id}/enroll so
  // that {course_id} is unambiguously a resource id and never an action name.
  // `user_id` in the body is ignored - enrolment is for the JWT bearer.
  rpc EnrollUser (EnrollUserRequest) returns (EnrollUserResponse) {
    option (google.api.http) = {
      post: "/api/enrollments"
      body: "*"
    };
  }

  // "me" instead of {user_id}: the caller is always the JWT bearer.
  rpc ListEnrolledCourses (ListEnrolledCoursesRequest) returns (ListEnrolledCoursesResponse) {
    option (google.api.http) = {
      get: "/api/enrollments/me"
    };
  }
}

message GetCourseRequest {
  string course_id = 1;
}

message GetCourseResponse {
  Course course = 1;
}

message ListCoursesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListCoursesResponse {
  repeated Course courses = 1;
  int32 total_count = 2;
}

message EnrollUserRequest {
  string user_id = 1;
  string course_id = 2;
}

message EnrollUserResponse {
  bool success = 1;
}

message ListEnrolledCoursesRequest {
  string user_id = 1;
}

message ListEnrolledCoursesResponse {
  repeated Course enrolled_courses = 1;
}


message Course {
  string id = 1;
  string code = 2;
  string title = 3;
  string description = 4;
  int32 credits = 5;
}
