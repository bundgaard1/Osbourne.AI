syntax = "proto3";

package assignment;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "osbourne.local/assignment-service/gen/assignment;assignment";

service AssignmentService {
  // Assignments
  rpc CreateAssignment(CreateAssignmentRequest) returns (CreateAssignmentResponse) {
    option (google.api.http) = {
      post: "/api/courses/{course_id}/assignments"
      body: "*"
    };
  }

  rpc GetCourseAssignments(GetCourseAssignmentsRequest) returns (GetCourseAssignmentsResponse) {
    option (google.api.http) = {
      get: "/api/courses/{course_id}/assignments"
    };
  }

  rpc GetAssignment(GetAssignmentRequest) returns (GetAssignmentResponse) {
    option (google.api.http) = {
      get: "/api/assignments/{assignment_id}"
    };
  }

  // Submissions
  //
  // SubmitAssignment and DownloadSubmission carry no google.api.http annotation
  // on purpose. They are client- and server-streaming, and a generated gateway
  // handler would carry the file as base64 inside JSON. They are served instead
  // by hand-written http.Handlers mounted on the same mux:
  //
  //   POST /api/assignments/{assignment_id}/submissions  multipart/form-data
  //   GET  /api/submissions/{submission_id}/file          raw bytes
  rpc SubmitAssignment(stream SubmitAssignmentRequest) returns (SubmitAssignmentResponse);
  rpc DownloadSubmission(DownloadSubmissionRequest) returns (stream DownloadSubmissionResponse);

  rpc GetSubmission(GetSubmissionRequest) returns (GetSubmissionResponse) {
    option (google.api.http) = {
      get: "/api/submissions/{submission_id}"
    };
  }

  // Every submission for an assignment, for staff.
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse) {
    option (google.api.http) = {
      get: "/api/assignments/{assignment_id}/submissions"
    };
  }

  // Only the calling student's submissions; identity comes from the JWT claims
  // and never from the request payload.
  rpc ListMySubmissions(ListMySubmissionsRequest) returns (ListSubmissionsResponse) {
    option (google.api.http) = {
      get: "/api/assignments/{assignment_id}/submissions/mine"
    };
  }

  // `score` and `feedback` come from the JSON body. The path parameter is the
  // submission, not the assignment.
  rpc GradeSubmission(GradeSubmissionRequest) returns (GradeSubmissionResponse) {
    option (google.api.http) = {
      post: "/api/submissions/{submission_id}/grade"
      body: "*"
    };
  }
}

// ---------------------------------------------------------------------------
// Assignment Entities & RPC Payloads
// ---------------------------------------------------------------------------

message Assignment {
  string id = 1;
  string course_id = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Timestamp due_date = 5;

}

message CreateAssignmentRequest {
  string course_id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Timestamp due_date = 4;
}

message CreateAssignmentResponse {
  Assignment assignment = 1;
}

message GetCourseAssignmentsRequest {
  string course_id = 1;
}

message GetCourseAssignmentsResponse {
  repeated Assignment assignments = 1;
}

message GetAssignmentRequest {
  string assignment_id = 1;
}

message GetAssignmentResponse {
  Assignment assignment = 1;
}

// ---------------------------------------------------------------------------
// Submission Entities & RPC Payloads
// ---------------------------------------------------------------------------

message Submission {
  string id = 1;
  string assignment_id = 2;
  string student_id = 3;
  string filename = 4;
  int64 size = 5;
  google.protobuf.Timestamp submitted_at = 6;
  bool graded = 7;
  optional int32 score = 8;
  optional string feedback = 9;
}

message SubmissionMetadata {
  string assignment_id = 1;
  string student_id = 2;
  string filename = 3;
  int64 size = 4;
}

message SubmitAssignmentRequest {
  oneof payload {
    SubmissionMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message SubmitAssignmentResponse {
  Submission submission = 1;
}

message DownloadSubmissionRequest {
  string submission_id = 1;
}

message DownloadSubmissionMetadata {
  string filename = 1;
  int64 size = 2;
}

message DownloadSubmissionResponse {
  oneof payload {
    DownloadSubmissionMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message GetSubmissionRequest {
  string submission_id = 1;
}

message GetSubmissionResponse {
  Submission submission = 1;
}

message ListSubmissionsRequest {
  string assignment_id = 1;
}

message ListSubmissionsResponse {
  repeated Submission submissions = 1;
}

// Returns only the calling student's submissions for an assignment. The
// student identity is taken from the authenticated JWT claims, never from the
// request payload.
message ListMySubmissionsRequest {
  string assignment_id = 1;
}

message GradeSubmissionRequest {
  string submission_id = 1;
  int32 score = 2;
  string feedback = 3;
}

message GradeSubmissionResponse {
  bool success = 1;
}
