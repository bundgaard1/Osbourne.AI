syntax = "proto3";

package assignment;

import "google/protobuf/timestamp.proto";

option go_package = "osbourne.local/assignment-service/gen/assignment;assignment";

service AssignmentService {
  // Assignments
  rpc CreateAssignment(CreateAssignmentRequest) returns (CreateAssignmentResponse);
  rpc GetCourseAssignments(GetCourseAssignmentsRequest) returns (GetCourseAssignmentsResponse);
  rpc GetAssignment(GetAssignmentRequest) returns (GetAssignmentResponse);

  // Submissions
  rpc SubmitAssignment(stream SubmitAssignmentRequest) returns (SubmitAssignmentResponse);
  rpc DownloadSubmission(DownloadSubmissionRequest) returns (stream DownloadSubmissionResponse);
  rpc GetSubmission(GetSubmissionRequest) returns (GetSubmissionResponse);
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse);
  rpc GradeSubmission(GradeSubmissionRequest) returns (GradeSubmissionResponse);
}

// ---------------------------------------------------------------------------
// Assignment Entities & RPC Payloads
// ---------------------------------------------------------------------------

message Assignment {
  string id = 1;
  string course_id = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Timestamp due_date = 5;

}

message CreateAssignmentRequest {
  string course_id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Timestamp due_date = 4;
}

message CreateAssignmentResponse {
  Assignment assignment = 1;
}

message GetCourseAssignmentsRequest {
  string course_id = 1;
}

message GetCourseAssignmentsResponse {
  repeated Assignment assignments = 1;
}

message GetAssignmentRequest {
  string assignment_id = 1;
}

message GetAssignmentResponse {
  Assignment assignment = 1;
}

// ---------------------------------------------------------------------------
// Submission Entities & RPC Payloads
// ---------------------------------------------------------------------------

message Submission {
  string id = 1;
  string assignment_id = 2;
  string student_id = 3;
  string filename = 4;
  int64 size = 5;
  google.protobuf.Timestamp submitted_at = 6;
  bool graded = 7;
  optional int32 score = 8;
  optional string feedback = 9;
}

message SubmissionMetadata {
  string assignment_id = 1;
  string student_id = 2;
  string filename = 3;
  int64 size = 4;
}

message SubmitAssignmentRequest {
  oneof payload {
    SubmissionMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message SubmitAssignmentResponse {
  Submission submission = 1;
}

message DownloadSubmissionRequest {
  string submission_id = 1;
}

message DownloadSubmissionResponse {
  bytes chunk = 1;
}

message GetSubmissionRequest {
  string submission_id = 1;
}

message GetSubmissionResponse {
  Submission submission = 1;
}

message ListSubmissionsRequest {
  string assignment_id = 1;
}

message ListSubmissionsResponse {
  repeated Submission submissions = 1;
}

message GradeSubmissionRequest {
  string submission_id = 1;
  int32 score = 2;
  string feedback = 3;
}

message GradeSubmissionResponse {
  bool success = 1;
}