syntax = "proto3";

package course_content;

import "google/api/annotations.proto";

option go_package = "osbourne.local/course-content-service/gen/course-content;coursecontent";

// Modules are addressed as a sub-resource of a course, so every route carries
// {course_id} even for the single-module operations. The service still looks the
// module up by {module_id} alone; {course_id} scopes the route and is available
// for a consistency check.
service CourseContentService {
  rpc CreateModule(CreateModuleRequest) returns (CreateModuleResponse) {
    option (google.api.http) = {
      post: "/api/courses/{course_id}/modules"
      body: "*"
    };
  }

  rpc GetModule(GetModuleRequest) returns (GetModuleResponse) {
    option (google.api.http) = {
      get: "/api/courses/{course_id}/modules/{module_id}"
    };
  }

  rpc UpdateModule(UpdateModuleRequest) returns (UpdateModuleResponse) {
    option (google.api.http) = {
      put: "/api/courses/{course_id}/modules/{module_id}"
      body: "*"
    };
  }

  rpc DeleteModule(DeleteModuleRequest) returns (DeleteModuleResponse) {
    option (google.api.http) = {
      delete: "/api/courses/{course_id}/modules/{module_id}"
    };
  }

  rpc ListModulesByCourseID(ListModulesByCourseIDRequest) returns (ListModulesByCourseIDResponse) {
    option (google.api.http) = {
      get: "/api/courses/{course_id}/modules"
    };
  }
}

message Module {
  string id = 1;
  string course_id = 2;
  string title = 3;
  string text = 4;
}

message CreateModuleRequest {
  string course_id = 1;
  string title = 2;
  string text = 3;
}

message CreateModuleResponse {
  Module module = 1;
}

message GetModuleRequest {
  string course_id = 1;
  string module_id = 2;
}

message GetModuleResponse {
  Module module = 1;
}

message UpdateModuleRequest {
  string course_id = 1;
  string module_id = 2;
  string title = 3;
  string text = 4;
}

message UpdateModuleResponse {
  Module module = 1;
}

message DeleteModuleRequest {
  string course_id = 1;
  string module_id = 2;
}

message DeleteModuleResponse {
  bool success = 1;
}

message ListModulesByCourseIDRequest {
  string course_id = 1;
}

message ListModulesByCourseIDResponse {
  repeated Module modules = 1;
}
