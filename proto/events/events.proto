syntax = "proto3";

package events;

import "google/protobuf/timestamp.proto";

option go_package = "osbourne.local/proto/gen/events/events;events";

// Generic shared event-envelope for RabbitMQ
message EventEnvelope {
  string id = 1;
  string type = 2; // e.g. "account.created"
  google.protobuf.Timestamp timestamp = 3;
  bytes payload = 4; // The binary Protobuf event itself
}

// Domain-specific events
message AccountCreatedEvent {
  string account_id = 1;
  string email = 2;
  string role = 3;
  string full_name = 4;
}

message CourseEnrolledEvent {
  string student_id = 1;
  string course_id = 2;
  string course_code = 3;
  string course_name = 4;
}

message GradePublishedEvent {
  string submission_id = 1;
  string assignment_id = 2;
  string assignment_name = 3;
  string student_id = 4;
  string course_id = 5;
  int32 grade = 6;
}